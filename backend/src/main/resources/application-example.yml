#   export DB_USERNAME=admin
#   export DB_PASSWORD=tu_password_segura
#   export SERVER_PORT=8080
#   export JWT_SECRET=tu_clave_secreta_jwt_de_al_menos_256_bits
#   export JWT_EXPIRATION=86400000
#
#   mvn spring-boot:run

