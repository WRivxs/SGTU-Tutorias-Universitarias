# o exporta estas variables de entorno antes de levantar la aplicacion.
#
# Ejemplo para ejecutar localmente contra tu instancia de AWS RDS:
#
#   export DB_HOST=tutorias-db.xxxxxxxxxx.us-east-1.rds.amazonaws.com
